# Gemeinsame Portliste für Hetzner Cloud Firewall (Phase 1, infra/) und Host-UFW (Phase 2, setup/).
# Eine Aenderung hier wirkt auf beide Firewall-Ebenen (rules.md Abschnitt 3).
# Jede Regel gilt fuer IPv4 (0.0.0.0/0) und IPv6 (::/0), siehe pipeline/vps-repo/01-provisioning.md.

ports:
  - port: 22
    proto: tcp
    purpose: ssh
  - port: 80
    proto: tcp
    purpose: http (spaeter App-Stack, TLS-Redirect)
  - port: 443
    proto: tcp
    purpose: https (spaeter App-Stack)
